name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, verify, and deploy production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    environment: production
    env:
      PYTHONUTF8: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify deployment environment
        run: python scripts/verify_deploy_env.py

      - name: Security scan before production patch
        run: python scripts/security_scan.py

      - name: Verify locked design source
        run: python scripts/verify_design_lock.py

      - name: Patch public Supabase config in CI workspace
        run: python scripts/configure_cloud.py --enable --url "$SUPABASE_URL" --key "$SUPABASE_PUBLISHABLE_KEY"

      - name: Check JavaScript syntax
        run: node --check frontend/mc_logic.js

      - name: Test financial planning modules
        run: node scripts/test_financial_planning.js

      - name: Rebuild application bundle
        working-directory: frontend
        run: python build_mc.py

      - name: Verify generated bundle
        run: python scripts/verify_generated_bundle.py

      - name: Build Cloudflare Worker package
        run: python scripts/build_cloudflare_worker.py

      - name: Deploy Worker
        working-directory: cloudflare
        run: npx --yes wrangler@4.111.0 deploy
